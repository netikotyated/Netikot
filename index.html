<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת ניהול קריאות שירות</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Heebo', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-[60] hidden bg-emerald-600 text-white px-5 py-3 rounded-xl shadow-lg text-sm font-bold">
        <i class="fa-solid fa-circle-check ml-2"></i><span id="toastText"></span>
    </div>

    <!-- Auth Screen: login / register / pending -->
    <div id="authScreen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 md:p-8 space-y-5">
            <div class="text-center">
                <div class="bg-blue-600 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg"><i class="fa-solid fa-wrench"></i></div>
                <h1 class="text-2xl font-bold text-gray-900">מערכת ניהול קריאות</h1>
                <p id="authSub" class="text-sm text-gray-500 mt-1">התחבר למערכת עם פרטי המשתמש שלך</p>
            </div>

            <form id="authForm" onsubmit="submitAuth(event)" class="space-y-4">
                <div id="regFields" class="space-y-4 hidden">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">שם מלא / שם משתמש</label>
                        <input type="text" id="regUser" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-right bg-white text-gray-800">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">סוג משתמש מבוקש</label>
                        <select id="regRole" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none
